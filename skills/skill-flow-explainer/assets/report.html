<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill · 流程与策略</title>
<style>
:root{--ink:#213747;--muted:#667986;--line:#dce5e9;--blue:#346c9b;--bg:#f4f7f9;--teal:#137b71}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif}header,main,footer{max-width:1240px;margin:auto;padding:32px}header{padding-top:48px}h1{font-size:38px;line-height:1.3;margin:12px 0}h2{font-size:22px}h3{font-size:20px;margin:5px 0 14px}p{margin:8px 0}.eyebrow{color:var(--teal);font-size:12px;letter-spacing:2px;font-weight:700}.lead{font-size:20px;max-width:1000px}.muted{color:var(--muted);font-size:14px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.chip{background:#e8eff5;color:var(--blue);padding:4px 12px;border-radius:8px;font-size:13px}.io{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.io>div{background:white;border:1px solid var(--line);border-radius:12px;padding:18px 22px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:15px 0 24px}input,button,select{font:inherit;padding:9px 12px;border:1px solid #c8d7df;border-radius:8px;background:white;color:var(--ink)}input{flex:1;min-width:220px}button,summary{cursor:pointer}button:hover{background:#edf4fa}button:focus-visible,summary:focus-visible{outline:3px solid #5da9d4}.columns,.row{display:grid;grid-template-columns:minmax(260px,330px) 48px minmax(0,1fr)}.columns{color:var(--muted);margin:0 0 15px;font-size:14px}.row{align-items:start;position:relative;margin-bottom:32px}.business{padding:25px;background:white;border:1px solid #bad0df;border-top:4px solid var(--blue);border-radius:12px;position:sticky;top:20px}.number{color:var(--blue);font-size:13px;font-weight:700}.business p{font-size:15px}.business label{display:block;color:var(--muted);font-size:12px;margin-top:14px}.bridge{text-align:center;padding-top:35px;color:#98afbf;font-size:25px}.down{text-align:center;color:#94aebf;margin:14px 0 -10px;font-size:26px}.strategies{background:white;border:1px solid var(--line);border-radius:12px;padding:8px 24px}.item{padding:18px 0;border-bottom:1px solid #e9eef1}.item:last-child{border:0}.item h4{display:inline;font-size:17px}.tag{font-size:12px;padding:3px 7px;border-radius:5px;margin-right:8px;background:#eaf1f7;color:var(--blue)}.tag.策略{background:#e8f4ef;color:#23735a}.tag.验收{background:#fff0de;color:#965b21}.item p{font-size:16px}.basis{font-size:12px;color:var(--muted)}details{margin-top:10px}summary{font-size:14px;color:var(--blue)}blockquote{margin:10px 0;padding:12px 16px;background:#f5f7f9;border-left:3px solid #c2d3df;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace}.evidence-path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.section{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-top:24px}.notice{border-left:4px solid #c48a4d;background:#fff8ef}.file{padding:12px 0;border-bottom:1px solid #e6edf1}.file code{color:var(--blue);overflow-wrap:anywhere}.empty{padding:14px;color:var(--muted)}footer{color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:760px){header,main,footer{padding:20px}h1{font-size:29px}.io{grid-template-columns:1fr}.columns{display:none}.row{grid-template-columns:1fr}.business{position:static}.bridge{padding:5px;transform:rotate(90deg)}.strategies{padding:5px 18px}}@media print{.toolbar{display:none}body{background:white}.business{position:static}.row{break-inside:avoid}details{display:block}}
</style></head><body><header id="header"></header><main><div class="toolbar"><input id="search" aria-label="搜索策略" placeholder="搜索策略、工具或关键词"><select id="kind" aria-label="内容类型"><option value="">全部内容</option><option>策略</option><option>工具</option><option>规则</option><option>验收</option></select><button id="expand">展开全部依据</button><button id="collapse">收起依据</button></div><div class="columns"><span>业务流程 · 做什么</span><span></span><span>对应策略与执行 · 怎么做</span></div><div id="flow"></div><div id="extra"></div></main><footer>离线报告 · 源码摘录已随文件保存 · 阅读与筛选不会执行被分析 Skill</footer>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
const d=JSON.parse(document.getElementById('report-data').textContent),basis={explicit:'文档明确规定',code:'静态代码确认',inferred:'分析归纳',runtime:'运行记录支持'},coverage={full:'已全文阅读',partial:'部分阅读',unread:'未阅读',skipped:'未采集内容'};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function add(p,tag,text,cls){const e=el(tag,text,cls);p.append(e);return e}
document.title=d.title;const header=document.getElementById('header');add(header,'div','SKILL / WORKFLOW × STRATEGY','eyebrow');add(header,'h1',d.title);add(header,'p',d.summary,'lead');let meta=add(header,'div',undefined,'meta');[d.skill,d.nodes.length+' 个业务节点','源码解读 · 非业务执行'].forEach(x=>add(meta,'span',x,'chip'));add(header,'p',d.scope,'muted');add(header,'details').append(el('summary','源码快照标识'),el('p',d.sourceHash,'evidence-path'));const io=add(header,'div',undefined,'io');for(const [t,v] of [['输入',d.input],['输出',d.output]]){const b=add(io,'div');add(b,'b',t);add(b,'p',v)}
const flow=document.getElementById('flow');for(const [idx,n] of d.nodes.entries()){const row=add(flow,'section',undefined,'row');row.id=n.id;const b=add(row,'div',undefined,'business');add(b,'div',String(idx+1).padStart(2,'0')+' / 业务节点','number');add(b,'h3',n.title);add(b,'p',n.purpose);for(const [t,v]of[['输入',n.input],['产物',n.output]]){add(b,'label',t);add(b,'p',v)}if(n.dependsOn.length)add(b,'p','承接：'+n.dependsOn.map(id=>d.nodes.find(x=>x.id===id).title).join('、'),'muted');if(idx<d.nodes.length-1)add(b,'div','↓','down');add(row,'div','→','bridge');const right=add(row,'div',undefined,'strategies');for(const i of n.items){const item=add(right,'article',undefined,'item');item.dataset.kind=i.kind;add(item,'span',i.kind,'tag '+i.kind);add(item,'h4',i.title);add(item,'p',i.text);add(item,'span',basis[i.basis],'basis');const detail=add(item,'details');add(detail,'summary','查看源码依据 · '+i.evidence.length+' 处');for(const ev of i.evidence){add(detail,'p',ev.file+' · L'+ev.start+'–'+ev.end,'evidence-path');add(detail,'blockquote',ev.quote)}}add(right,'div','此节点没有符合当前筛选的条目；业务流程保持显示。','empty hidden')}
const extra=document.getElementById('extra');for(const [title,items,cls]of[['条件分支与返回路径',d.branches,'section'],['覆盖范围与待确认事项',d.limitations,'section notice']]){if(items.length){const s=add(extra,'section',undefined,cls);add(s,'h2',title);items.forEach((x,i)=>add(s,'p',(i+1)+'. '+x))}}const files=add(extra,'details',undefined,'section');add(files,'summary','文件分工与阅读覆盖 · '+d.files.length+' 项');for(const f of d.files){const r=add(files,'div',undefined,'file');add(r,'code',f.path);add(r,'span',' · '+coverage[f.coverage],'basis');add(r,'p',f.role)}
function filter(){const q=document.getElementById('search').value.toLowerCase(),k=document.getElementById('kind').value;for(const i of document.querySelectorAll('.item'))i.classList.toggle('hidden',!!(k&&i.dataset.kind!==k)||!i.textContent.toLowerCase().includes(q));for(const s of document.querySelectorAll('.strategies'))s.querySelector('.empty').classList.toggle('hidden',!!s.querySelector('.item:not(.hidden)'))}document.getElementById('search').oninput=filter;document.getElementById('kind').onchange=filter;document.getElementById('expand').onclick=()=>document.querySelectorAll('.item details').forEach(x=>x.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('.item details').forEach(x=>x.open=false);
</script></body></html>
